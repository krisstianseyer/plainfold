name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Build portable edition and archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run portable
          $dir = "src-tauri/target/release/bundle/portable/Plainfold_${version}_portable_x64"
          7z a -t7z -mx=9 "src-tauri/target/release/bundle/portable/Plainfold_${version}_portable_x64.7z" "$dir"
          Get-FileHash "src-tauri/target/release/bundle/portable/Plainfold_${version}_portable_x64.7z" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Plainfold_${version}_portable_x64.7z" } |
            Set-Content "src-tauri/target/release/bundle/portable/Plainfold_${version}_portable_x64.7z.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: plainfold-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.7z
            src-tauri/target/release/bundle/portable/*.sha256

  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: plainfold-debian
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  fedora:
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - run: dnf install -y git nodejs npm curl
      - uses: actions/checkout@v4
      - run: |
          dnf install -y gcc gcc-c++ make wget file openssl-devel \
            webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles rpm
      - run: |
          dnf install -y ./src-tauri/target/release/bundle/rpm/*.rpm
          rpm -q plainfold
      - uses: actions/upload-artifact@v4
        with:
          name: plainfold-fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: plainfold-macos-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian, fedora, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.7z' \) \
            -exec cp {} release/ \;
          cd release
          rm -f *.sha256
          ls -l
          for file in *; do
            case "$file" in
              *.sha256) continue ;;
            esac
            sha256sum "$file" | sed 's|.*/||' > "$file.sha256"
          done
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            release/SHA256SUMS.txt
          generate_release_notes: true
